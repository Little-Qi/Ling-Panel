  </defs>

  <!-- 小尺寸专用：胶囊 + 灵珠 + 单枚展开尖括号 -->
  <rect x="2" y="14" width="60" height="36" rx="18" fill="url(#cap)" stroke="url(#rim)" stroke-width="2"/>
  <circle cx="21" cy="32" r="13" fill="url(#orb)"/>
  <circle cx="16.5" cy="27.5" r="3.6" fill="#FFFFFF" opacity="0.62"/>
  <path d="M40 23.5l10 8.5-10 8.5" fill="none" stroke="url(#chev)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
